<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Main Calculator -->
    <div class="calculator">

        <!-- Calculator Header -->
        <div class="calculator-header">
            <h1>Calculator</h1>
        </div>


        <!-- Display -->
        <div class="display">

            <div id="previous-display" class="previous-display">
            </div>

            <div id="current-display" class="current-display">
                0
            </div>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <!-- First Row -->
            <button class="btn clear" data-action="clear">
                AC
            </button>

            <button class="btn delete" data-action="delete">
                DEL
            </button>

            <button class="btn operator" data-operation="%">
                %
            </button>

            <button class="btn operator" data-operation="/">
                ÷
            </button>


            <!-- Second Row -->
            <button class="btn number" data-number="7">
                7
            </button>

            <button class="btn number" data-number="8">
                8
            </button>

            <button class="btn number" data-number="9">
                9
            </button>

            <button class="btn operator" data-operation="*">
                ×
            </button>


            <!-- Third Row -->
            <button class="btn number" data-number="4">
                4
            </button>

            <button class="btn number" data-number="5">
                5
            </button>

            <button class="btn number" data-number="6">
                6
            </button>

            <button class="btn operator" data-operation="-">
                −
            </button>


            <!-- Fourth Row -->
            <button class="btn number" data-number="1">
                1
            </button>

            <button class="btn number" data-number="2">
                2
            </button>

            <button class="btn number" data-number="3">
                3
            </button>

            <button class="btn operator" data-operation="+">
                +
            </button>


            <!-- Fifth Row -->
            <button class="btn number zero" data-number="0">
                0
            </button>

            <button class="btn number" data-number=".">
                .
            </button>

            <button class="btn equals" data-action="equals">
                =
            </button>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        <p>HTML • CSS • JavaScript Calculator</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
